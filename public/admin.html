<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoucherVault - Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.8);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary-blue: #3b82f6;
    }
    body {
      background-color: var(--bg-dark);
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
    }
    .form-control, .form-select {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--card-border);
      color: #fff;
      border-radius: 10px;
    }
    .form-control:focus, .form-select:focus {
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      border-color: var(--primary-blue);
      box-shadow: none;
    }
  </style>
</head>
<body class="p-4">
  <div class="container" style="max-width: 900px;">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h3 class="fw-bold mb-1"><i class="fa-solid fa-shield-halved text-primary me-2"></i>Admin Inventory Portal</h3>
        <p class="text-secondary small mb-0">Upload encrypted vouchers and monitor active product stock.</p>
      </div>
      <a href="/" class="btn btn-outline-light btn-sm rounded-pill"><i class="fa-solid fa-arrow-left me-1"></i> Back to Store</a>
    </div>

    <!-- Bulk Voucher Upload Card -->
    <div class="card p-4 mb-4">
      <h5 class="fw-bold mb-3"><i class="fa-solid fa-file-arrow-up text-info me-2"></i>Bulk Ingest Vouchers</h5>
      <div class="row g-3">
        <div class="col-md-12">
          <label class="form-label small text-secondary">Select Product</label>
          <select id="productSelect" class="form-select"></select>
        </div>
        <div class="col-md-12">
          <label class="form-label small text-secondary">Voucher Lines (Format: <code>CODE,PIN,SERIAL</code> per line)</label>
          <textarea id="voucherDataInput" rows="5" class="form-control font-monospace" placeholder="AMZN-LIVE-1111,1234,SN101&#10;AMZN-LIVE-2222,5678,SN102"></textarea>
        </div>
        <div class="col-md-6">
          <label class="form-label small text-secondary">Expiry Date</label>
          <input type="date" id="expiryDateInput" class="form-control" value="2027-12-31">
        </div>
        <div class="col-md-6 d-flex align-items-end">
          <button class="btn btn-primary w-100 fw-bold py-2" onclick="uploadVouchers()"><i class="fa-solid fa-cloud-arrow-up me-1"></i> Encrypt & Upload to DB</button>
        </div>
      </div>
    </div>

    <!-- Active Products Summary -->
    <div class="card p-4">
      <h5 class="fw-bold mb-3"><i class="fa-solid fa-boxes-stacked text-warning me-2"></i>Live Inventory Stock</h5>
      <div class="table-responsive">
        <table class="table table-dark table-hover mb-0">
          <thead>
            <tr>
              <th>Brand</th>
              <th>Product Title</th>
              <th>Denomination</th>
              <th>Selling Price</th>
              <th>Available Stock</th>
            </tr>
          </thead>
          <tbody id="inventoryTableBody">
            <tr><td colspan="5" class="text-center text-secondary py-3">Loading inventory...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    async function loadAdminData() {
      try {
        const res = await fetch('/api/v1/products');
        const data = await res.json();
        const select = document.getElementById('productSelect');
        const tbody = document.getElementById('inventoryTableBody');

        select.innerHTML = data.products.map(p => `
          <option value="${p.product_id}">${p.brand_name} - ${p.title} (₹${p.selling_price})</option>
        `).join('');

        tbody.innerHTML = data.products.map(p => `
          <tr>
            <td><strong>${p.brand_name}</strong></td>
            <td>${p.title}</td>
            <td>₹${p.denomination}</td>
            <td class="text-success fw-bold">₹${p.selling_price}</td>
            <td>
              <span class="badge ${p.available_stock > 0 ? 'bg-success' : 'bg-danger'}">
                ${p.available_stock} Available
              </span>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        alert('Failed to load products: ' + err.message);
      }
    }

    async function uploadVouchers() {
      const productId = document.getElementById('productSelect').value;
      const rawText = document.getElementById('voucherDataInput').value.trim();
      const expiry = document.getElementById('expiryDateInput').value;

      if (!productId || !rawText) {
        return alert('Please select a product and enter voucher data.');
      }

      const lines = rawText.split('\n').filter(l => l.trim().length > 0);
      const vouchers = lines.map(line => {
        const parts = line.split(',').map(s => s.trim());
        return {
          code: parts[0],
          pin: parts[1] || null,
          serialNumber: parts[2] || 'SN-' + Math.floor(Math.random()*10000),
          expiryDate: expiry
        };
      });

      try {
        const res = await fetch('/api/v1/admin/vouchers/bulk', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ voucherProductId: productId, vouchers })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        alert(`Success: ${vouchers.length} vouchers encrypted and uploaded!`);
        document.getElementById('voucherDataInput').value = '';
        loadAdminData();
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    loadAdminData();
  </script>
</body>
</html>
