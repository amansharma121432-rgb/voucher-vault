<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voucher Vault - 24/7 Gift Cards</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col">
    <!-- Header -->
    <header class="border-b border-gray-800 p-4 flex justify-between items-center max-w-6xl w-full mx-auto">
        <h1 class="text-2xl font-black text-blue-500 tracking-wider">VV VOUCHER VAULT</h1>
        <div id="authSection">
            <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg font-semibold text-sm">Sign In / Sign Up</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4">
        <h2 class="text-xl font-bold my-4">Available Gift Cards</h2>
        <div id="brandsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <p class="text-gray-400">Loading vouchers...</p>
        </div>
    </main>

    <!-- Auth Modal -->
    <div id="authModal" class="fixed inset-0 bg-black/80 flex items-center justify-center hidden p-4">
        <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl max-w-md w-full relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white">✕</button>
            <h3 id="modalTitle" class="text-xl font-bold mb-4">Create an Account</h3>
            
            <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
                <input type="text" id="fullName" placeholder="Full Name" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-sm focus:outline-none focus:border-blue-500">
                <input type="email" id="email" placeholder="Email Address" required class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-sm focus:outline-none focus:border-blue-500">
                <input type="password" id="password" placeholder="Password" required class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-sm focus:outline-none focus:border-blue-500">
                
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 font-bold py-3 rounded-lg text-sm transition">Sign Up</button>
            </form>

            <p class="text-center text-xs text-gray-400 mt-4 cursor-pointer hover:underline" onclick="toggleAuthMode()" id="switchText">
                Already have an account? Sign In
            </p>
        </div>
    </div>

    <script>
        let isLogin = false;

        function openModal() { document.getElementById('authModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('authModal').classList.add('hidden'); }

        function toggleAuthMode() {
            isLogin = !isLogin;
            document.getElementById('modalTitle').innerText = isLogin ? 'Sign In' : 'Create an Account';
            document.getElementById('submitBtn').innerText = isLogin ? 'Sign In' : 'Sign Up';
            document.getElementById('fullName').style.display = isLogin ? 'none' : 'block';
            document.getElementById('switchText').innerText = isLogin ? "Don't have an account? Sign Up" : "Already have an account? Sign In";
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const full_name = document.getElementById('fullName').value;

            const endpoint = isLogin ? '/api/login' : '/api/register';
            const payload = isLogin ? { email, password } : { email, password, full_name };

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Authentication failed');

                alert(isLogin ? 'Login Successful!' : 'Account Created Successfully!');
                localStorage.setItem('user', JSON.stringify(data.user));
                closeModal();
                checkUser();
            } catch (err) {
                alert(err.message);
            }
        }

        function checkUser() {
            const user = JSON.parse(localStorage.getItem('user'));
            if (user) {
                document.getElementById('authSection').innerHTML = `<span class="text-sm font-semibold text-green-400">👤 ${user.full_name || user.email}</span>`;
            }
        }

        async function loadStore() {
            try {
                const res = await fetch('/api/brands');
                const brands = await res.json();
                const grid = document.getElementById('brandsGrid');
                if (!brands.length) {
                    grid.innerHTML = '<p class="text-gray-400">No vouchers available currently.</p>';
                    return;
                }
                grid.innerHTML = brands.map(b => `
                    <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl flex flex-col justify-between">
                        <h4 class="text-lg font-bold text-white mb-2">${b.name}</h4>
                        <div class="space-y-2">
                            ${b.products.map(p => `
                                <div class="bg-gray-800/60 p-2 rounded-lg flex justify-between items-center text-sm">
                                    <span>${p.title}</span>
                                    <span class="font-bold text-green-400">₹${p.selling_price}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                console.error(e);
            }
        }

        checkUser();
        loadStore();
    </script>
</body>
</html>
